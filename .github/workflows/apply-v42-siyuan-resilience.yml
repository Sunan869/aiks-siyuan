name: Apply V4.2 SiYuan resilience patch

on:
  push:
    branches:
      - fix/v4.2-embedded-runtime-resilience
    paths:
      - ".github/workflows/apply-v42-siyuan-resilience.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v4.2-embedded-runtime-resilience
          fetch-depth: 0

      - name: Apply minimal runtime resilience changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          conf = Path("kernel/model/conf.go")
          text = conf.read_text(encoding="utf-8")
          old = "if err := filelock.WriteFile(confPath, data); err != nil {"
          new = "if err := writeConfFile(confPath, data); err != nil {"
          if old not in text:
              raise SystemExit("conf.go write call anchor not found")
          conf.write_text(text.replace(old, new, 1), encoding="utf-8")

          index = Path("app/src/index.ts")
          text = index.read_text(encoding="utf-8")
          import_anchor = 'import {initializeEnglishCommandTranslations} from "./command/english";\n'
          import_line = 'import {isAiksEmbedded} from "./aiks/profile";\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit("index.ts import anchor not found")
              text = text.replace(import_anchor, import_anchor + import_line, 1)
          condition_old = "if (!isInMobileApp() && !isIOSDevice() && !window.siyuan.config.readonly &&"
          condition_new = "if (!isAiksEmbedded() && !isInMobileApp() && !isIOSDevice() && !window.siyuan.config.readonly &&"
          if condition_new not in text:
              if condition_old not in text:
                  raise SystemExit("index.ts browser compatibility condition anchor not found")
              text = text.replace(condition_old, condition_new, 1)
          index.write_text(text, encoding="utf-8")

          Path("kernel/model/conf_write.go").write_text(r'''package model

import (
    "errors"
    "os"
    "strings"
    "time"

    "github.com/88250/gulu"
)

const confWriteMaxAttempts = 6

func writeConfFile(filePath string, data []byte) error {
    return writeConfFileWithRetry(filePath, data, gulu.File.WriteFileSafer, time.Sleep)
}

func writeConfFileWithRetry(
    filePath string,
    data []byte,
    writer func(string, []byte, os.FileMode) error,
    sleep func(time.Duration),
) error {
    var err error
    for attempt := 1; attempt <= confWriteMaxAttempts; attempt++ {
        err = writer(filePath, data, 0644)
        if err == nil {
            return nil
        }
        if !isTransientConfWriteError(err) || attempt == confWriteMaxAttempts {
            return err
        }
        sleep(time.Duration(attempt*50) * time.Millisecond)
    }
    return err
}

func isTransientConfWriteError(err error) bool {
    if err == nil {
        return false
    }
    if errors.Is(err, os.ErrPermission) {
        return true
    }
    message := strings.ToLower(err.Error())
    return strings.Contains(message, "access is denied") ||
        strings.Contains(message, "used by another process") ||
        strings.Contains(message, "being used by another process")
}
''', encoding="utf-8")
          PY

          gofmt -w kernel/model/conf_write.go kernel/model/conf_write_test.go
          rm .github/workflows/apply-v42-siyuan-resilience.yml

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "AIKS Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(v4.2): harden embedded SiYuan runtime"
          git push origin HEAD:fix/v4.2-embedded-runtime-resilience
